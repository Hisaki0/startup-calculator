<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Kit - 사장님 실무 인사이트 & 커뮤니티</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5924680090368411" crossorigin="anonymous"></script>
    <meta name="naver-site-verification" content="8bc5bc1fcde8ded1285e14e2f4ae3583fc9de1a2" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>Startup Kit</h1>
            <p style="font-size:0.85rem; color:var(--text-sub);">실무 데이터 기반 비즈니스 인사이트 플랫폼</p>
        </div>
        <div class="user-panel" id="user-panel">
            <span id="welcome-msg">인증 필요</span>
            <a href="index.html#auth" id="auth-link-btn">로그인/가입</a>
            <button id="logout-btn" style="display:none; background:#ef4444; color:#fff; border:none;" onclick="handleLogout()">로그아웃</button>
        </div>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-btn">실무 계산기</a>
        <a href="community.html" class="nav-btn active">정보 & 커뮤니티</a>
        <a href="index.html#auth" class="nav-btn" id="nav-auth-btn">계정 관리</a>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div>
                <h2>사장님 실무 인사이트 & 소통 라운지</h2>
                <p style="font-size:0.9rem; color:var(--text-sub);">검증된 창업 노하우를 확인하고 실무 경험을 공유하세요.</p>
            </div>
            <button class="btn-action" id="write-btn" style="width:auto; padding:10px 18px; margin-top:0; display:none;" onclick="toggleWriteForm()">자유 글쓰기</button>
        </div>

        <div id="write-section" style="display:none; background:#f8fafc; padding:20px; border-radius:8px; border:1px solid var(--border); margin-bottom:20px;">
            <h3 style="font-size:1.05rem; margin-bottom:12px; color:var(--primary);">신규 게시글 등록</h3>
            <div class="input-group"><label>글 제목</label><input type="text" id="post_title" placeholder="제목을 입력하세요"></div>
            <div class="input-group"><label>본문 내용</label><textarea id="post_content" placeholder="창업 노하우나 고민을 상세히 공유해주세요"></textarea></div>
            <button class="btn-action" onclick="savePost()">게시글 등록 발행</button>
        </div>

        <div id="post-list-container">
            <ul class="post-list" id="post-ul"></ul>
        </div>

        <div id="post-detail-view" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <button onclick="backToList()" style="padding:8px 14px; font-size:0.85rem; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">← 목록으로 돌아가기</button>
                <div id="detail-header-action"></div>
            </div>
            <div class="post-detail">
                <h3 id="detail-title" style="font-size:1.25rem; color:var(--primary); margin-bottom:10px; font-weight:bold;"></h3>
                <p id="detail-meta" style="font-size:0.85rem; color:var(--text-sub); border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:15px;"></p>
                <div id="detail-content" style="font-size:1rem; white-space: pre-line; line-height: 1.8;"></div>
            </div>
        </div>
    </div>

    <footer><p>&copy; 2026 Startup Kit. All rights reserved.</p></footer>
</div>
<script src="script.js"></script>
</body>
</html>
